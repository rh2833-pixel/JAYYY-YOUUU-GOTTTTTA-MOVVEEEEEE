<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fresh Out! The Stinky Rush 3D</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#2b1b17; font-family:Arial,sans-serif; color:#fff; }
  canvas { display:block; cursor:crosshair; }
  .hud { position:fixed; pointer-events:none; text-shadow:0 0 4px #000, 0 0 4px #000; font-weight:bold; }
  #score { top:12px; left:14px; font-size:20px; line-height:1.4; }
  #help { top:12px; right:14px; font-size:12px; opacity:.8; text-align:right; }
  #healthWrap { bottom:16px; left:14px; width:220px; height:18px; background:#400; border:2px solid #000; }
  #health { height:100%; width:100%; background:#3c3; }
  #weapons { bottom:16px; right:14px; width:340px; }
  .w { padding:5px 8px; margin-top:4px; background:rgba(0,0,0,.55); font-size:14px; text-shadow:none; }
  .w.on { background:#ffc72c; color:#000; }
  #bossWrap { top:14px; left:50%; transform:translateX(-50%); width:260px; text-align:center; display:none; }
  #bossBar { height:12px; background:#400; border:2px solid #000; }
  #boss { height:100%; width:100%; background:#e33; }
  #msg { top:28%; width:100%; text-align:center; font-size:40px; color:#ffc72c; }
  #screen { position:fixed; inset:0; background:rgba(0,0,0,.72); display:flex; flex-direction:column;
            align-items:center; justify-content:center; text-align:center; font-size:20px; line-height:1.6; }
  #screen h2 { font-size:52px; color:#ffc72c; margin:0 0 10px; }
</style>
</head>
<body>
<div class="hud" id="score"></div>
<div class="hud" id="help">Arrows or WASD: move | Mouse: aim | Click: shoot<br>1: Deodorant | 2: Air Freshener Bomb<br>3: Buy Disinfectant Ring</div>
<div class="hud" id="healthWrap"><div id="health"></div></div>
<div class="hud" id="weapons"></div>
<div class="hud" id="bossWrap">BIG STINKY BOSS<div id="bossBar"><div id="boss"></div></div></div>
<div class="hud" id="msg"></div>
<div id="screen"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ===== SETTINGS (change these to balance the game) =====
const WAVES = [
  { count: 6,  speed: 3.0, tough: 0 },   // tough = how many of the count are black monsters
  { count: 9,  speed: 3.5, tough: 2 },
  { count: 12, speed: 4.0, tough: 4 },
  { count: 15, speed: 4.5, tough: 5 },
  { count: 4,  speed: 4.2, tough: 1, boss: true }
];
const WEAPONS = [
  { name: 'Deodorant Spray',    cooldown: 0.12, damage: 1, speed: 32 },
  { name: 'Air Freshener Bomb', cooldown: 1.6,  damage: 8, speed: 16, radius: 4.8 }
];
const RING = { cost: 100, time: 10, radius: 3.6, tick: 0.4 };   // Disinfectant Ring shop item
const HALF_X = 19, HALF_Z = 14;   // size of the restaurant floor

// ===== THREE.JS SETUP =====
if (typeof THREE === 'undefined') {
  document.getElementById('screen').innerHTML = '<h2>Oops</h2>Could not load the 3D library.<br>Check your internet connection and refresh.';
  throw new Error('Three.js failed to load');
}
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfff1c9);
const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 0.75));
const sun = new THREE.DirectionalLight(0xffffff, 0.6);
sun.position.set(10, 25, 10);
scene.add(sun);
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

const mat = c => new THREE.MeshLambertMaterial({ color: c });
const box = (w, h, d, color, x, y, z) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat(color));
  m.position.set(x, y, z); scene.add(m); return m;
};

// ===== RESTAURANT =====
(function buildRestaurant() {
  // checkered floor
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = '#fff7e0'; g.fillRect(0, 0, 128, 128);
  g.fillStyle = '#f0dcae'; g.fillRect(0, 0, 64, 64); g.fillRect(64, 64, 64, 64);
  const tex = new THREE.CanvasTexture(cv);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(20, 15);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(HALF_X * 2 + 2, HALF_Z * 2 + 2),
                               new THREE.MeshLambertMaterial({ map: tex }));
  floor.rotation.x = -Math.PI / 2; scene.add(floor);
  // back wall, counter, menu boards
  box(42, 8, 0.5, 0xffc72c, 0, 4, -HALF_Z - 1.5);
  box(34, 2.2, 2.5, 0xd52b1e, 0, 1.1, -HALF_Z - 0.2);
  box(34.4, 0.3, 2.8, 0xffffff, 0, 2.3, -HALF_Z - 0.2);
  for (let i = -1; i <= 1; i++) {
    box(7, 2.6, 0.3, 0x222222, i * 10, 5.5, -HALF_Z - 1.2);
    box(6.2, 0.4, 0.1, 0xffc72c, i * 10, 5.9, -HALF_Z - 1.0);
    box(6.2, 0.4, 0.1, 0xd52b1e, i * 10, 5.1, -HALF_Z - 1.0);
  }
  // side walls
  box(0.5, 4, 30, 0xd52b1e, -HALF_X - 1.5, 2, 0);
  box(0.5, 4, 30, 0xd52b1e, HALF_X + 1.5, 2, 0);
  // round tables with stools
  for (const [tx, tz] of [[-12, -4], [12, -4], [-12, 7], [12, 7]]) {
    const top = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.2, 20), mat(0xd52b1e));
    top.position.set(tx, 1.4, tz); scene.add(top);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 1.4, 10), mat(0x555555));
    leg.position.set(tx, 0.7, tz); scene.add(leg);
    for (const s of [-2.4, 2.4]) {
      const st = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.7, 12), mat(0xffc72c));
      st.position.set(tx + s, 0.35, tz); scene.add(st);
    }
  }
})();

// ===== CHARACTER BUILDERS =====
const stinkMat = mat(0x9aad3a), bossMat = mat(0x6b7d1e), freshMat = mat(0x7fd8ff);
const toughMat = mat(0x151515), toughEyeMat = mat(0xff3b3b);   // black monster with red eyes
const darkCloudMat = new THREE.MeshLambertMaterial({ color: 0x2a1f33, transparent: true, opacity: 0.55 });
const cloudMat = new THREE.MeshLambertMaterial({ color: 0x8aa02a, transparent: true, opacity: 0.45 });
const eyeMat = mat(0x000000);
const sphereGeo = new THREE.SphereGeometry(1, 14, 12);
const bodyGeo = new THREE.CylinderGeometry(0.6, 0.75, 1.3, 14);
const smallGeo = new THREE.SphereGeometry(1, 8, 8);

function makeCharacter(bodyMaterial, headMaterial, eyes = eyeMat) {
  const grp = new THREE.Group();
  const body = new THREE.Mesh(bodyGeo, bodyMaterial); body.position.y = 0.65; grp.add(body);
  const head = new THREE.Mesh(sphereGeo, headMaterial); head.scale.setScalar(0.55); head.position.y = 1.7; grp.add(head);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(smallGeo, eyes);
    eye.scale.setScalar(0.1); eye.position.set(s * 0.22, 1.8, 0.5); grp.add(eye);
  }
  return { grp, body, head };
}

function makePlayer() {
  const c = makeCharacter(mat(0xd52b1e), mat(0xffd9a0));
  const can = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.9, 10), mat(0x777777));
  can.rotation.x = Math.PI / 2; can.position.set(0.5, 1.0, 0.8); c.grp.add(can);
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.22, 0.2, 10), mat(0x3aa0ff));
  cap.rotation.x = Math.PI / 2; cap.position.set(0.5, 1.0, 1.3); c.grp.add(cap);
  scene.add(c.grp);
  return c.grp;
}

function makeRing() {
  const grp = new THREE.Group();
  const torus = new THREE.Mesh(new THREE.TorusGeometry(RING.radius, 0.15, 8, 48),
    new THREE.MeshBasicMaterial({ color: 0xbff3ff }));
  torus.rotation.x = Math.PI / 2; grp.add(torus);
  const disc = new THREE.Mesh(new THREE.CircleGeometry(RING.radius, 40),
    new THREE.MeshBasicMaterial({ color: 0x96e6ff, transparent: true, opacity: 0.25 }));
  disc.rotation.x = -Math.PI / 2; disc.position.y = 0.05; grp.add(disc);
  for (let i = 0; i < 6; i++) {     // little spray puffs that spin around the ring
    const puff = new THREE.Mesh(smallGeo, new THREE.MeshBasicMaterial({ color: 0xffffff }));
    puff.scale.setScalar(0.3);
    puff.position.set(Math.cos(i * 1.047) * RING.radius, 0.3, Math.sin(i * 1.047) * RING.radius);
    grp.add(puff);
  }
  grp.visible = false; scene.add(grp);
  return grp;
}

function buyRing() {
  if (state !== 'play' || ringT > 0 || score - spent < RING.cost) return;
  spent += RING.cost; ringT = RING.time; ringTick = 0; ringMesh.visible = true;
}

// ===== GAME STATE =====
let state = 'menu';
let player, enemies = [], bullets = [], effects = [];
let score = 0, waveIndex = 0, waveTimer = 0, spawnLeft = 0, spawnTimer = 0, highScore = 0, toughLeft = 0, spent = 0, ringT = 0, ringTick = 0, ringMesh;
try { highScore = +localStorage.getItem('freshOutHigh3d') || 0; } catch (e) {}

const keys = {};
const mouseNDC = new THREE.Vector2(0, 0);
let mouseDown = false;
const aimPoint = new THREE.Vector3();
const raycaster = new THREE.Raycaster();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;   // lowercase so W and w both work
  if (e.key === '1') P.weapon = 0;
  if (e.key === '2') P.weapon = 1;
  if (e.key === '3') buyRing();
  if (e.key.startsWith('Arrow')) e.preventDefault();
  if (e.key === 'Enter' && state !== 'play') startGame();
});
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
window.addEventListener('mousemove', e => {
  mouseNDC.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
});
window.addEventListener('mousedown', () => { if (state !== 'play') startGame(); else mouseDown = true; });
window.addEventListener('mouseup', () => mouseDown = false);

const P = { x: 0, z: 0, r: 0.8, speed: 11, hp: 100, weapon: 0, cd: [0, 0], invuln: 0 };

function clearObjects() {
  for (const o of [...enemies, ...bullets, ...effects]) scene.remove(o.mesh);
  enemies = []; bullets = []; effects = [];
}

function startGame() {
  clearObjects();
  if (!player) player = makePlayer();
  if (!ringMesh) ringMesh = makeRing();
  spent = 0; ringT = 0; ringMesh.visible = false;
  Object.assign(P, { x: 0, z: 4, hp: 100, weapon: 0, cd: [0, 0], invuln: 0 });
  score = 0; waveIndex = 0;
  document.getElementById('screen').style.display = 'none';
  beginWave();
  state = 'play';
}

function beginWave() {
  const w = WAVES[waveIndex];
  waveTimer = 2; spawnLeft = w.count; spawnTimer = 0; toughLeft = w.tough || 0;
  if (w.boss) spawnEnemy(true);
}

function spawnEnemy(boss, tough) {
  const w = WAVES[waveIndex];
  const side = Math.floor(Math.random() * 3);   // left, right, or from the front
  let x, z;
  if (side === 0) { x = -HALF_X - 2; z = (Math.random() * 2 - 1) * HALF_Z; }
  else if (side === 1) { x = HALF_X + 2; z = (Math.random() * 2 - 1) * HALF_Z; }
  else { x = (Math.random() * 2 - 1) * HALF_X; z = HALF_Z + 2; }
  const body = boss ? bossMat : tough ? toughMat : stinkMat;
  const c = makeCharacter(body, body, tough ? toughEyeMat : eyeMat);
  const r = boss ? 2.3 : tough ? 1.25 : 0.9;
  c.grp.scale.setScalar(boss ? 2.6 : tough ? 1.4 : 1);
  // little stink clouds that orbit the character
  const clouds = [];
  for (let i = 0; i < 3; i++) {
    const cl = new THREE.Mesh(smallGeo, tough ? darkCloudMat : cloudMat); cl.scale.setScalar(0.35);
    c.grp.add(cl); clouds.push(cl);
  }
  scene.add(c.grp);
  enemies.push({ mesh: c.grp, parts: c, clouds, x, z, boss, r,
    hp: boss ? 40 : tough ? 3 : 1, max: boss ? 40 : tough ? 3 : 1,
    dmg: boss ? 20 : tough ? 15 : 10, pts: boss ? 500 : tough ? 25 : 10, tough,
    speed: boss ? w.speed * 0.55 : tough ? w.speed * 0.75 : w.speed * (0.85 + Math.random() * 0.3),
    fresh: false, t: 0, phase: Math.random() * 6 });
}

// ===== SHOOTING =====
function shoot() {
  const wp = WEAPONS[P.weapon];
  if (P.cd[P.weapon] > 0) return;
  P.cd[P.weapon] = wp.cooldown;
  const dx = aimPoint.x - P.x, dz = aimPoint.z - P.z;
  const len = Math.hypot(dx, dz) || 1;
  const big = P.weapon === 1;
  const mesh = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: big ? 0xb06cff : 0x3aa0ff }));
  mesh.scale.setScalar(big ? 0.45 : 0.2);
  mesh.position.set(P.x + dx / len * 1.3, 1.0, P.z + dz / len * 1.3);
  scene.add(mesh);
  bullets.push({ mesh, x: mesh.position.x, z: mesh.position.z,
    vx: dx / len * wp.speed, vz: dz / len * wp.speed,
    type: P.weapon, tx: aimPoint.x, tz: aimPoint.z, life: 1.4 });
}

function hurtEnemy(e, dmg) {
  if (e.fresh) return;
  e.hp -= dmg;
  if (e.hp <= 0) {
    e.fresh = true; e.t = 1.6;
    score += e.pts;
    e.parts.body.material = freshMat; e.parts.head.material = freshMat;
    e.clouds.forEach(c => c.visible = false);
  }
}

function explode(x, z) {
  const R = WEAPONS[1].radius;
  const mesh = new THREE.Mesh(sphereGeo, new THREE.MeshBasicMaterial({ color: 0x96e6ff, transparent: true, opacity: 0.5 }));
  mesh.position.set(x, 0.6, z); mesh.scale.setScalar(0.1); scene.add(mesh);
  effects.push({ mesh, t: 0.4, R });
  for (const e of enemies) if (Math.hypot(e.x - x, e.z - z) < R + e.r) hurtEnemy(e, WEAPONS[1].damage);
}

// ===== UPDATE =====
function update(dt) {
  // aim: shoot a ray from the camera through the mouse onto the floor
  raycaster.setFromCamera(mouseNDC, camera);
  raycaster.ray.intersectPlane(floorPlane, aimPoint);

  let dx = 0, dz = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dz -= 1;
  if (keys['arrowdown'] || keys['s']) dz += 1;
  if (dx && dz) { dx *= 0.7071; dz *= 0.7071; }
  P.x = Math.max(-HALF_X, Math.min(HALF_X, P.x + dx * P.speed * dt));
  P.z = Math.max(-HALF_Z, Math.min(HALF_Z, P.z + dz * P.speed * dt));
  P.cd[0] -= dt; P.cd[1] -= dt; P.invuln -= dt;
  if (mouseDown && waveTimer <= 0) shoot();

  if (waveTimer > 0) waveTimer -= dt;
  else if (spawnLeft > 0) {
    spawnTimer -= dt;
    if (spawnTimer <= 0) {
      const tough = toughLeft > 0 && Math.random() < toughLeft / spawnLeft;
      if (tough) toughLeft--;
      spawnEnemy(false, tough); spawnLeft--; spawnTimer = 1.1;
    }
  }

  for (const b of bullets) {
    b.x += b.vx * dt; b.z += b.vz * dt; b.life -= dt;
    b.mesh.position.x = b.x; b.mesh.position.z = b.z;
    if (b.type === 0) {
      for (const e of enemies)
        if (!e.fresh && Math.hypot(e.x - b.x, e.z - b.z) < e.r + 0.3) { hurtEnemy(e, 1); b.life = 0; break; }
    } else {
      let boom = Math.hypot(b.tx - b.x, b.tz - b.z) < 0.6 || b.life <= 0;
      for (const e of enemies) if (!e.fresh && Math.hypot(e.x - b.x, e.z - b.z) < e.r + 0.5) boom = true;
      if (boom) { explode(b.x, b.z); b.life = 0; }
    }
  }
  for (const b of bullets) if (b.life <= 0) scene.remove(b.mesh);
  bullets = bullets.filter(b => b.life > 0);

  const now = performance.now() / 1000;
  for (const e of enemies) {
    const a = Math.atan2(P.z - e.z, P.x - e.x);
    if (e.fresh) {                 // happy customers run away and spin
      e.t -= dt;
      e.x -= Math.cos(a) * 9 * dt; e.z -= Math.sin(a) * 9 * dt;
      e.mesh.rotation.y += 10 * dt;
      e.mesh.position.y = Math.abs(Math.sin(now * 12)) * 0.5;
    } else {
      e.x += Math.cos(a) * e.speed * dt; e.z += Math.sin(a) * e.speed * dt;
      e.mesh.rotation.y = Math.atan2(P.x - e.x, P.z - e.z);
      e.mesh.position.y = Math.abs(Math.sin(now * 6 + e.phase)) * 0.15;   // waddle
      e.clouds.forEach((c, i) => {
        const ang = now * 2 + i * 2.1 + e.phase;
        c.position.set(Math.cos(ang) * 1.3, 1.2 + Math.sin(ang * 1.5) * 0.4, Math.sin(ang) * 1.3);
      });
      if (P.invuln <= 0 && Math.hypot(e.x - P.x, e.z - P.z) < e.r + P.r) {
        P.hp -= e.dmg; P.invuln = 0.8;
      }
    }
    e.mesh.position.x = e.x; e.mesh.position.z = e.z;
  }
  for (const e of enemies) if (e.fresh && e.t <= 0) scene.remove(e.mesh);
  enemies = enemies.filter(e => !(e.fresh && e.t <= 0));

  for (const f of effects) {
    f.t -= dt;
    f.mesh.scale.setScalar(Math.max(0.1, f.R * (1 - f.t / 0.4)));
    f.mesh.material.opacity = Math.max(0, f.t * 1.2);
    if (f.t <= 0) scene.remove(f.mesh);
  }
  effects = effects.filter(f => f.t > 0);

  // Disinfectant Ring: hurts every stinky monster touching it
  if (ringT > 0) {
    ringT -= dt; ringTick -= dt;
    if (ringTick <= 0) {
      ringTick = RING.tick;
      for (const e of enemies)
        if (!e.fresh && Math.hypot(e.x - P.x, e.z - P.z) < RING.radius + e.r) hurtEnemy(e, 1);
    }
    ringMesh.position.set(P.x, 0.4, P.z);
    ringMesh.rotation.y += dt * 2;
    ringMesh.visible = ringT > 0 && (ringT > 2 || Math.floor(ringT * 6) % 2 === 0);   // blinks when ending
  } else ringMesh.visible = false;

  // player model
  player.position.set(P.x, 0, P.z);
  player.rotation.y = Math.atan2(aimPoint.x - P.x, aimPoint.z - P.z);
  player.visible = !(P.invuln > 0 && Math.floor(P.invuln * 15) % 2);

  if (P.hp <= 0) { P.hp = 0; endGame('over'); return; }

  if (waveTimer <= 0 && spawnLeft === 0 && enemies.every(e => e.fresh)) {
    score += 50 * (waveIndex + 1);
    if (waveIndex === WAVES.length - 1) { score += 500; endGame('win'); }
    else { waveIndex++; beginWave(); }
  }
}

function endGame(result) {
  state = result; mouseDown = false;
  if (ringMesh) ringMesh.visible = false;
  if (score > highScore) {
    highScore = score;
    try { localStorage.setItem('freshOutHigh3d', highScore); } catch (e) {}
  }
  const html = result === 'over'
    ? `<h2>GAME OVER</h2>Score: ${score}<br>High score: ${highScore}<br>Click or press Enter to restart`
    : `<h2>YOU WIN!</h2>The restaurant smells fresh again!<br>Score: ${score}<br>High score: ${highScore}<br>Click or press Enter to play again`;
  showScreen(html);
}
function showScreen(html) {
  const s = document.getElementById('screen'); s.innerHTML = html; s.style.display = 'flex';
}

// ===== HUD =====
function ringLine() {
  const txt = ringT > 0 ? 'ACTIVE ' + Math.ceil(ringT) + 's'
            : score - spent >= RING.cost ? 'press 3 to buy' : 'need ' + RING.cost + ' pts';
  return `<div class="w ${ringT > 0 ? 'on' : ''}">3: Disinfectant Ring (${RING.cost} pts) - ${txt}</div>`;
}
function updateHUD() {
  document.getElementById('score').innerHTML = `Score: ${score}<br>Points to spend: ${score - spent}<br>Wave ${waveIndex + 1}/${WAVES.length}`;
  document.getElementById('health').style.width = P.hp + '%';
  document.getElementById('health').style.background = P.hp > 30 ? '#3c3' : '#e33';
  document.getElementById('weapons').innerHTML = WEAPONS.map((w, i) =>
    `<div class="w ${P.weapon === i ? 'on' : ''}">${i + 1}: ${w.name} ${P.cd[i] > 0 ? '(wait)' : '✓'}</div>`).join('') + ringLine();
  const boss = enemies.find(e => e.boss && !e.fresh);
  document.getElementById('bossWrap').style.display = boss ? 'block' : 'none';
  if (boss) document.getElementById('boss').style.width = (100 * boss.hp / boss.max) + '%';
  document.getElementById('msg').textContent = (state === 'play' && waveTimer > 0)
    ? 'WAVE ' + (waveIndex + 1) + (WAVES[waveIndex].boss ? ': THE BIG STINKY BOSS!' : '') : '';
}

// ===== MAIN LOOP =====
showScreen('<h2>FRESH OUT!</h2>The Stinky Rush 3D<br>Freshen up the stinky customers with deodorant and air freshener.<br>Survive 5 waves and beat the Big Stinky Boss!<br><br>Click or press Enter to start');
let last = performance.now();
function loop(now) {
  const dt = Math.min((now - last) / 1000, 0.05);
  last = now;
  if (state === 'play') { update(dt); updateHUD(); }
  // camera follows the player from above and in front
  const cx = P.x * 0.5, cz = P.z * 0.5;
  camera.position.set(cx, 26, cz + 17);
  camera.lookAt(cx, 0, cz);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
